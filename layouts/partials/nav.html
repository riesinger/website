{{- $page := .page }}
{{- $menuID := .menuID }}

{{- with index site.Menus $menuID }}
<nav class="site-nav" aria-label="Main navigation">
    <ul>
        {{- range . }}
        <li>
            <a
                href="{{ .URL }}"
                {{ if or ($page.IsMenuCurrent .Menu .) ($page.HasMenuCurrent .Menu .) (strings.HasPrefix $page.RelPermalink .URL) }}aria-current="page"{{ end }}
            >{{ .Name }}</a>
        </li>
        {{- end }}
    </ul>
</nav>
{{- end }}
