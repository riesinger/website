{{ define "main" }}
<main id="content">
    <div class="rail">
        <p class="rail-aside label">Tag</p>
        <h1 class="doc-title">{{ .Title | lower }}</h1>
        <p class="doc-subtitle">
            {{ len .Pages }} {{ cond (eq (len .Pages) 1) "entry" "entries" }} ·
            <a href="/tags/">browse all tags</a>
        </p>
    </div>
    {{ partial "entries" (dict "pages" .Pages) }}
</main>
{{ end }}
