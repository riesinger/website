{{ define "main" }}
<main id="content" class="frame document-page{{ if .Params.wide }} reference-page{{ end }}">
    <a class="back-link" href="{{ "posts/" | relURL }}">{{ partial "icon" "back" }} All writing</a>
    <header class="page-heading">
        <div class="doc-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
            <span>{{ .ReadingTime }} min read</span>
            {{ partial "tags" . }}
        </div>
        <h1 class="doc-title">{{ .Title }}</h1>
        {{ with .Params.subtitle }}
        <p class="doc-subtitle">{{ . }}</p>
        {{ end }}
    </header>
    <article class="doc-body prose">{{ .Content }}</article>
</main>
{{ end }}
